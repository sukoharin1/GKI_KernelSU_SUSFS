name: NUWA One-Click Build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  start-nuwa-build:
    name: Start fixed nuwa KernelSU Next and SUSFS build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Show fixed nuwa configuration
        shell: bash
        run: |
          {
            echo "## NUWA fixed build configuration"
            echo ""
            echo "- Device: \`nuwa\`"
            echo "- Model: \`2210132G\`"
            echo "- ROM: \`OS3.0.311.0.WMBCNXM\`"
            echo "- Kernel family: \`5.15.x-android13\`"
            echo "- Kernel sublevel: \`194\`"
            echo "- Patch level: \`2025-12\`"
            echo "- Page size: \`4k\`"
            echo "- Root flavor: \`KernelSU-Next\`"
            echo "- SUSFS: \`true\`"
            echo "- NoMount: \`false\`"
            echo "- Optional features: \`false\`"
            echo "- Cache: \`false\`"
            echo "- Version mismatch: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify required workflow exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh workflow view main.yml \
            --repo "$GITHUB_REPOSITORY" \
            --yaml \
            > main-workflow.yml

          grep -q "workflow_dispatch:" main-workflow.yml

          echo "MAIN_WORKFLOW_FOUND=true"

      - name: Dispatch fixed KernelSU Next and SUSFS build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh workflow run main.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_type=CI \
            -f use_cache=false \
            -f allow_version_mismatch=false \
            -f kernel_build_version=5.15.x-android13 \
            -f os_patch_level=2025-12 \
            -f page_size=4k \
            -f root_flavor=KernelSU-Next \
            -f use_susfs=true \
            -f use_nomount=false \
            -f use_bbg=false \
            -f use_net=false \
            -f use_ds=false \
            -f use_ntsync=false \
            -f use_ptrace=false \
            -f use_unicode=false \
            -f use_bpf=false \
            -f use_perf=false \
            -f test_release_notes=false

          echo "DISPATCH_REQUEST_SENT=true"

      - name: Find dispatched Build Kernels run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID=""

          for attempt in $(seq 1 30)
          do
            sleep 5

            RUN_ID="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow main.yml \
                --branch main \
                --event workflow_dispatch \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            )"

            if [ -n "$RUN_ID" ]
            then
              break
            fi
          done

          if [ -z "$RUN_ID" ]
          then
            echo "ERROR: Could not find dispatched Build Kernels run"
            exit 1
          fi

          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"

          {
            echo ""
            echo "## Build Kernels started"
            echo ""
            echo "- Run ID: \`$RUN_ID\`"
            echo "- Build URL: $RUN_URL"
            echo ""
            echo "Open the Build URL and wait for the kernel build to finish."
            echo ""
            echo "Download the artifact containing:"
            echo ""
            echo "\`5.15.194-android13-2025-12-KernelSU-Next-AnyKernel3\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "RUN_ID=$RUN_ID"
          echo "RUN_URL=$RUN_URL"
